name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: SideTracker-${{ matrix.arch }}
          path: |
            dist/*.exe
            !dist/*unpacked*/**

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.exe --repo "$GITHUB_REPOSITORY" --title "SideTracker ${GITHUB_REF_NAME#v}" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" out/*.exe --repo "$GITHUB_REPOSITORY" --clobber
